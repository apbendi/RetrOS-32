# How the C harness runs TinyCC's own tests (apps/tcc/tinycc/tests/tests2), as their Makefile does, but compiled by
# the cross compiler and run on RetrOS. One line per setting:
#   skip NAME REASON        not built: the reason says what it needs that RetrOS, or this TCC build, doesn't have
#   flags NAME FLAG...      extra compiler flags
#   files NAME FILE...      more source files from tests2, compiled with it
#   args NAME ARG...        arguments to run it with. A double-quoted one can have spaces; /t/tests2/ holds tests2's files.
#   norun NAME              compiled on RetrOS (run.py --native) to a file and run, not with tcc -run, as upstream

skip 34_array_assignment array assignment isn't standard C (skipped upstream too)
skip 60_errors_and_warnings -dt runs code snippets with tcc -run, which a cross compiler can't
skip 96_nodata_wanted -dt runs code snippets with tcc -run, which a cross compiler can't
skip 125_atomic_misc -dt runs code snippets with tcc -run, which a cross compiler can't
skip 128_run_atexit -dt runs code snippets with tcc -run, which a cross compiler can't
skip 112_backtrace needs backtraces, which RetrOS's TCC is built without
skip 113_btdll needs backtraces and shared libraries
skip 114_bound_signal needs bounds checking, signals and fork
skip 115_bound_setjmp needs bounds checking, which RetrOS's TCC is built without
skip 116_bound_setjmp2 needs bounds checking, which RetrOS's TCC is built without
skip 117_builtins needs bounds checking, which RetrOS's TCC is built without
skip 126_bound_global needs bounds checking, which RetrOS's TCC is built without
skip 132_bound_test needs bounds checking, which RetrOS's TCC is built without
skip 106_versym needs threads
skip 124_atomic_counter needs threads
skip 144_tls needs threads and thread-local storage
skip 146_tls_extern needs thread-local storage and the system linker
skip 148_linker_symbols needs shared libraries
skip 95_bitfields expects Windows' bitfield layout on 32-bit x86 (skipped upstream too)
skip 95_bitfields_ms expects Microsoft's compiler's bitfield layout
skip 138_arm64_encoding ARM64 only
skip 139_arm64_errors ARM64 only
skip 140_arm64_extasm ARM64 only
skip 141_riscv_asm RISC-V only
skip 145_winarm64_interlocked Windows on ARM64 only
skip 101_cleanup needs about 256 KB of stack, and RetrOS gives a program 64 KB (#115)
skip 119_random_stuff needs over 512 KB of stack for a 256 KB struct passed by value, and RetrOS gives 64 KB (#115)

flags 76_dollars_in_identifiers -fdollars-in-identifiers
flags 22_floating_point -lm
flags 24_math_library -lm
files 104_inline 104+_inline.c
files 120_alias 120+_alias.c

norun 42_function_pointer
norun 108_constructor
norun 120_alias

args 31_args arg1 arg2 arg3 arg4 arg5
args 46_grep "[^* ]*[:a:d: ]+\:\*-/: $" /t/tests2/46_grep.c
